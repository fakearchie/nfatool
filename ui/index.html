<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>archievable</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="titlebar" data-tauri-drag-region>
        <div class="titlebar-brand" data-tauri-drag-region>
          <span class="tb-mark" aria-hidden="true">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="4" rx="1" />
              <path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8" />
              <path d="M10 12h4" />
            </svg>
          </span>
          <span class="tb-title">archievable</span>
        </div>
        <div class="titlebar-controls">
          <button class="tb-btn" id="winMin" title="Minimize" aria-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="4.6" width="8" height="0.9" fill="currentColor" /></svg>
          </button>
          <button class="tb-btn" id="winMax" title="Maximize" aria-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="0.9" aria-hidden="true"><rect x="1.4" y="1.4" width="7.2" height="7.2" rx="1.2" /></svg>
          </button>
          <button class="tb-btn tb-close" id="winClose" title="Close" aria-label="Close">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
          </button>
        </div>
      </div>

      <header class="topbar">
        <span class="title">Accounts<span id="accountCount" class="title-count"></span></span>
        <div class="topbar-actions">
          <button id="refreshBtn" class="btn">Refresh</button>
          <button id="importBtn" class="btn btn-accent">Import</button>
        </div>
      </header>

      <main class="list-wrap">
        <div id="accountList" class="list"></div>
        <div id="emptyState" class="empty hidden">
          <span class="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="4" rx="1" />
              <path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8" />
              <path d="M10 12h4" />
            </svg>
          </span>
          <div class="empty-title">No accounts yet</div>
          <div class="empty-sub">Import a login code to get started.</div>
          <button id="emptyImportBtn" class="btn btn-accent">Import accounts</button>
        </div>
      </main>

      <footer class="footbar">
        <button id="settingsBtn" class="foot-btn" title="Settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Settings</span>
        </button>
        <button id="dangerBtn" class="foot-btn foot-danger">Reset cache</button>
      </footer>
    </div>

    <div id="toastWrap" class="toast-wrap"></div>

    <div id="importModal" class="overlay hidden">
      <div class="dialog">
        <div class="dialog-head">
          <span>Import accounts</span>
          <button class="btn-icon" data-action="close-import" title="Close" aria-label="Close">&times;</button>
        </div>
        <p class="dialog-text">Paste one login code per line.</p>
        <textarea
          id="importInput"
          spellcheck="false"
          placeholder="One code per line"
        ></textarea>
        <div class="dialog-foot">
          <button id="pasteBtn" class="btn">Paste</button>
          <button id="doImportBtn" class="btn btn-accent">Import</button>
        </div>
        <div id="importStatus" class="dialog-msg"></div>
      </div>
    </div>

    <div id="confirmModal" class="overlay hidden">
      <div class="dialog dialog-sm">
        <div class="dialog-head">
          <span id="confirmTitle">Confirm</span>
          <button class="btn-icon" data-action="close-confirm" title="Close" aria-label="Close">&times;</button>
        </div>
        <p id="confirmText" class="dialog-text"></p>
        <div class="dialog-foot">
          <button class="btn" data-action="close-confirm">Cancel</button>
          <button id="confirmYes" class="btn btn-danger">Confirm</button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="overlay hidden">
      <div class="dialog dialog-settings">
        <div class="dialog-head">
          <span>Settings</span>
          <button class="btn-icon" data-action="close-settings" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="settings-list">
          <label class="setting-row">
            <span class="setting-info">
              <span class="setting-label">Always start Invisible</span>
              <span class="setting-desc">Log in as Invisible, not Online or Idle.</span>
            </span>
            <input type="checkbox" class="toggle" data-setting="always_invisible" />
          </label>
          <label class="setting-row">
            <span class="setting-info">
              <span class="setting-label">Pause game updates on login</span>
              <span class="setting-desc">Sets installed games to update only when launched, so signing in won't start background downloads. New installs and Workshop still download.</span>
            </span>
            <input type="checkbox" class="toggle" data-setting="cancel_downloads_on_login" />
          </label>
          <label class="setting-row">
            <span class="setting-info">
              <span class="setting-label">Streamer mode</span>
              <span class="setting-desc">Hide usernames and Steam IDs in this app and tray. Avatars stay visible.</span>
            </span>
            <input type="checkbox" class="toggle" data-setting="streamer_mode" />
          </label>
          <label class="setting-row">
            <span class="setting-info">
              <span class="setting-label">Launch Steam minimized</span>
              <span class="setting-desc">Start Steam in the background after sign-in.</span>
            </span>
            <input type="checkbox" class="toggle" data-setting="launch_steam_minimized" />
          </label>
          <label class="setting-row">
            <span class="setting-info">
              <span class="setting-label">Mute notifications on login</span>
              <span class="setting-desc">Disable friend online/message notifications in Steam.</span>
            </span>
            <input type="checkbox" class="toggle" data-setting="mute_notifications_on_login" />
          </label>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
